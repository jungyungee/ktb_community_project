apiVersion: v1
kind: LimitRange
metadata:
  name: {{ .Release.Name }}-limitrange
  namespace: {{ .Release.Namespace }}
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 300m
        memory: 384Mi

      default:
        cpu: 500m
        memory: 512Mi

      max:
        cpu: 1
        memory: 1Gi
