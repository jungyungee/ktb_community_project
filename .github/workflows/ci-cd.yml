# ci-cd.yml
name: Backend CI/CD

on:
  # PR 에서 CI
  pull_request:
    branches:
      - dev
      - main
  # dev -> main merge 시 CD
  push:
    branches:
      - main
      - 'feature/#23-ci_cd'
  # 수동 작업
  workflow_dispatch:

jobs:
  # 테스트 코드는 추후에 추가 예정
  # 빌드 및 헬스 체크
  ci:
    runs-on: ubuntu-latest
    steps:
      # 깃허브 러너에 저장소를 클론
      - name: checkout repository
        uses: actions/checkout@v6
      # - 테스트 코드 작성 후 gradle Test 추가 필요
      # - jdk set up
      # - gradle test

      # 이미지 빌드 - 도커파일 사용
      - name: image build
        run: docker build -t ktb-community-backend:${{ github.sha }} .

      # 만들어진 이미지로 도커 run (도커 컴포즈 사용)
      - name: docker run
        run: IMAGE_TAG=${{ github.sha }} docker compose -f compose.ci.yml up -d

      # 헬스체크
      - name: health check
        run: |
          for i in {1..10}; do
            if curl -f http://localhost:8080/server-api/health; then
              echo "Health Check Success"
              exit 0
            fi
          
            echo "Waiting ($i/10)"
            sleep 5
          done
          
          echo "Health Check Failed"
          docker compose -f compose.ci.yml logs backend
          exit 1

      # 도커 이미지 저장 (tar 파일로)
      - name: save docker image
        run: |
          docker save \
          ktb-community-backend:${{ github.sha }} \
          -o backend-image.tar

      # 아티팩트 저장소에 저장
      - name: docker image upload - artifact
        uses: actions/upload-artifact@v5
        with:
          name: backend-image
          path: backend-image.tar
          retention-days: 1 # cd에서 바로 사용할 것이므로 짧게 보관

  # ci 에서 만드러진 artifact 이용해서
  # 도커 허브 push, 배포 서버에서 해당 이미지로 헬스체크
  # 성공 여부에 따라 롤백 혹은 유지
  cd:
    needs:
      - ci
    # 동시에 배포되어서 ALB 전환이 꼬이지 않도록 방지
    concurrency:
      group: backend-production-deploy
      cancel-in-progress: false
    # PR 때 실행되지 않도록 조건 추가
    if: |
      github.event_name == 'push' &&
      (
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/feature/#23-ci_cd'
      )

    runs-on: ubuntu-latest
    steps:
      # 아티팩트 다운로드
      - name: artifact download
        uses: actions/download-artifact@v5
        with:
          name: backend-image

      # 도커 load 이미지 복원
      - name: restore docker image
        run: |
          docker load -i backend-image.tar
          docker image ls

      # 도커 허브에 push
      # 도커 허브 접속 위해 로그인
      - name: docker hub login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # 도커 허브용 이미지 이름으로 태그 변경
      - name: tag docker image
        run: |
          docker tag \
            ktb-community-backend:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/ktb-community-backend:${{ github.sha }}
      # 도커 허브에 push
      - name: push docker image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/ktb-community-backend:${{ github.sha }}

      # Blue-Green 배포를 위해 현재 사용 중인 것을 확인 후,
      # 사용 중이지 않은 쪽에 새 버전을 띄움
      # 1. AWS 인증
      - name: AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      # 2. 현재 사용 중인 대상 그룹 확인
      - name: determine active environment
        id: deployment
        run: |
          CURRENT_TARGET_GROUP=$(aws elbv2 describe-rules \
            --rule-arns "${{ secrets.ALB_RULE_ARN }}" \
            --query 'Rules[0].Actions[0].TargetGroupArn' \
            --output text)
          echo "active_target_group=$CURRENT_TARGET_GROUP" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT_TARGET_GROUP" = "${{ secrets.BLUE_TARGET_GROUP_ARN }}" ]; then
            echo "active=blue" >> "$GITHUB_OUTPUT"
            echo "inactive=green" >> "$GITHUB_OUTPUT"
            echo "inactive_port=8081" >> "$GITHUB_OUTPUT"
            echo "inactive_target_group=${{ secrets.GREEN_TARGET_GROUP_ARN }}" >> "$GITHUB_OUTPUT"
          elif [ "$CURRENT_TARGET_GROUP" = "${{ secrets.GREEN_TARGET_GROUP_ARN }}" ]; then
            echo "active=green" >> "$GITHUB_OUTPUT"
            echo "inactive=blue" >> "$GITHUB_OUTPUT"
            echo "inactive_port=8080" >> "$GITHUB_OUTPUT"
            echo "inactive_target_group=${{ secrets.BLUE_TARGET_GROUP_ARN }}" >> "$GITHUB_OUTPUT"
          else
            echo "Unknown target group: $CURRENT_TARGET_GROUP"
            exit 1
          fi
      # 3. 배포 서버 접속 후에 사용중이지 않은 쪽을 새 이미지로 배포 후 헬스체크
      # SSM을 통해 비활성 Blue/Green 환경에 새 이미지 배포
      - name: ssm_deploy
        id: ssm_deploy
        run: |
          cat > ssm-parameters.json <<EOF
          {
            "commands": [
              "cd /home/ubuntu/ktb_community_project",
              "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/ktb-community-backend:${{ github.sha }}",
              "IMAGE_TAG=${{ github.sha }} HOST_PORT=${{ steps.deployment.outputs.inactive_port }} docker compose -p backend-${{ steps.deployment.outputs.inactive }} up -d --force-recreate backend",
              "for i in {1..10}; do if curl -f http://localhost:${{ steps.deployment.outputs.inactive_port }}/server-api/health; then echo 'Container health check success'; exit 0; fi; echo \"Waiting for container (\$i/10)\"; sleep 5; done",
              "docker compose -p backend-${{ steps.deployment.outputs.inactive }} logs backend",
              "exit 1"
            ]
          }
          EOF

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.BACKEND_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters file://ssm-parameters.json \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command ID: $COMMAND_ID"

      # SSM 배포 명령 완료 대기 및 결과 확인
      - name: wait for SSM deployment
        run: |
          aws ssm wait command-executed \
            --command-id "${{ steps.ssm_deploy.outputs.command_id }}" \
            --instance-id "${{ secrets.BACKEND_INSTANCE_ID }}"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "${{ steps.ssm_deploy.outputs.command_id }}" \
            --instance-id "${{ secrets.BACKEND_INSTANCE_ID }}" \
            --query "Status" \
            --output text)

          echo "SSM command status: $STATUS"

          echo "----- STDOUT -----"
          aws ssm get-command-invocation \
            --command-id "${{ steps.ssm_deploy.outputs.command_id }}" \
            --instance-id "${{ secrets.BACKEND_INSTANCE_ID }}" \
            --query "StandardOutputContent" \
            --output text

          if [ "$STATUS" != "Success" ]; then
            echo "----- STDERR -----"
            aws ssm get-command-invocation \
              --command-id "${{ steps.ssm_deploy.outputs.command_id }}" \
              --instance-id "${{ secrets.BACKEND_INSTANCE_ID }}" \
              --query "StandardErrorContent" \
              --output text

            exit 1
          fi

      # 대상그룹 헬스체크
      - name: inactive target health check
        run: |
          aws elbv2 wait target-in-service \
            --target-group-arn "${{ steps.deployment.outputs.inactive_target_group }}"
      # 실패 시 기존의 서비스로 하고, 워크플로우가 중단되어 새로운 버전은 실패처리
      # 성공 시 ALB 트래픽 전환
      - name: ALB traffic switch
        run: |
          aws elbv2 modify-rule \
            --rule-arn "${{ secrets.ALB_RULE_ARN }}" \
            --actions \
              "Type=forward,TargetGroupArn=${{ steps.deployment.outputs.inactive_target_group }}"

      # 전환 후에도, 기존 컨테이너를 잠시 유지하면서
      # 실제 서비스의 헬스체크 필요
      - name: deploy health check
        id: deploy_health
        continue-on-error: true
        run: |
          for i in {1..10}; do
            if curl -f https://yungee-community.cloud/server-api/health; then
              echo "Post deployment health check success"
              exit 0
            fi

            echo "Waiting ($i/10)"
            sleep 5
          done

          echo "Post deployment health check failed"
          exit 1
      # 롤백: 전환 후 헬스체크에서 문제 발생 시, 기존으로 전환
      - name: rollback
        if: steps.deploy_health.outcome == 'failure'
        run: |
          aws elbv2 modify-rule \
            --rule-arn "${{ secrets.ALB_RULE_ARN }}" \
            --actions \
              "Type=forward,TargetGroupArn=${{ steps.deployment.outputs.active_target_group }}"

          echo "Rollback completed"
          exit 1

      # 최종 성공 로그
      - name: success
        if: steps.deploy_health.outcome == 'success'
        run: |
          echo "Deployment completed"
          echo "Active environment: ${{ steps.deployment.outputs.inactive }}"
          echo "Image tag: ${{ github.sha }}"