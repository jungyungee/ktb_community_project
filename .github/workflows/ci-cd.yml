# ci-cd.yml
name: Backend CI/CD

on:
  # PR 에서 CI
  pull_request:
    branches:
      - dev
      - main
  # dev -> main merge 시 CD
  push:
    branches:
      - main
  # 수동 작업
  workflow_dispatch:

jobs:
  # 테스트 코드는 추후에 추가 예정
  # 빌드 및 헬스 체크
  ci:
    runs-on: ubuntu-latest
    steps:
      # 깃허브 러너에 저장소를 클론
      - name: checkout repository
        uses: actions/checkout@v6
      # - 테스트 코드 작성 후 gradle Test 추가 필요
      # - jdk set up
      # - gradle test

      # 이미지 빌드 - 도커파일 사용
      - name: image build
        run: docker build -t ktb-community-backend:${{ github.sha }} .

      # 만들어진 이미지로 도커 run (도커 컴포즈 사용)
      - name: docker run
        run: IMAGE_TAG=${{ github.sha }} docker compose -f compose.ci.yml up -d

      # 헬스체크
      - name: health check
        run: |
          for i in {1..10}; do
            if curl -f http://localhost:8080/server-api/health; then
              echo "Health Check Success"
              exit 0
            fi
          
            echo "Waiting ($i/10)"
            sleep 5
          done
          
          echo "Health Check Failed"
          docker compose -f compose.ci.yml logs backend
          exit 1

      # 도커 이미지 저장 (tar 파일로)
      - name: save docker image
        run: |
          docker save \
          ktb-community-backend:${{ github.sha }} \
          -o backend-image.tar

      # 아티팩트 저장소에 저장
      - name: docker image upload - artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: backend-image.tar
          retention-days: 1 # cd에서 바로 사용할 것이므로 짧게 보관

  # ci 에서 만드러진 artifact 이용해서
  # 도커 허브 push, 배포 서버에서 해당 이미지로 헬스체크
  # 성공 여부에 따라 롤백 혹은 유지
  cd:
    needs:
      - ci
    # PR 때 실행되지 않도록 조건 추가
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # 아티팩트 다운로드
      - name: artifact download
        uses: actions/download-artifact@v4
        with:
          name: backend-image

      # 도커 load 이미지 복원
      - name: restore docker image
        run: |
          docker load -i backend-image.tar
          docker image ls

      # 도커 허브에 push
      # 도커 허브 접속 위해 로그인
      - name: docker hub login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # 도커 허브용 이미지 이름으로 태그 변경
      - name: tag docker image
        run: |
          docker tag \
            ktb-community-backend:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/ktb-community-backend:${{ github.sha }}
      # 도커 허브에 push
      - name: push docker image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/ktb-community-backend:${{ github.sha }}

      # Blue-Green 배포를 위해 현재 사용 중인 것을 확인 후,
      # 사용 중이지 않은 쪽에 새 버전을 띄움

      # 배포 서버 접속 후에 사용중이지 않은 쪽을 새 이미지로 교체 후 헬스체크

      # 실패 시 기존의 서비스로 하고, 새로운 Green 은 실패처리
      # 성공 시 ALB 트래픽 전환

      # 전환 후에도, 기존 컨테이너를 잠시 유지

      # 롤백: 새 Green 에서 문제 발생 시, 기존 Blue로 전환